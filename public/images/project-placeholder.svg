    </defs>
    <rect width="1600" height="900" fill="url(#bg)"/>
    <g fill="none" stroke="#4f46e5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
        <rect x="560" y="330" width="480" height="300" rx="36"/>
