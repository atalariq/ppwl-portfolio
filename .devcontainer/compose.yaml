services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: devcontainer
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ..:/workspaces/ppwl-portfolio:cached

  db:
    image: docker.io/library/mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ppwl_portfolio
      MARIADB_USER: ppwl
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - devcontainer-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  devcontainer-db-data:
